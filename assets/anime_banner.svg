<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="50%" stop-color="#2b1150"/>
      <stop offset="100%" stop-color="#0d0620"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6ec7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cf5ff"/>
      <stop offset="100%" stop-color="#3ba4d6"/>
    </linearGradient>
    <linearGradient id="hairR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb6e6"/>
      <stop offset="100%" stop-color="#ff6ec7"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" rx="18" fill="url(#bg)"/>
  <rect width="900" height="220" rx="18" fill="url(#glow)"/>

  <!-- scattered stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="30" r="2"/>
    <circle cx="300" cy="60" r="1.5"/>
    <circle cx="450" cy="20" r="2"/>
    <circle cx="600" cy="50" r="1.5"/>
    <circle cx="780" cy="30" r="2"/>
    <circle cx="850" cy="90" r="1.5"/>
  </g>

  <!-- center title -->
  <text x="450" y="115" text-anchor="middle" font-family="Fira Code, monospace" font-size="30" font-weight="700" fill="#ffffff">knefrus</text>
  <text x="450" y="145" text-anchor="middle" font-family="Fira Code, monospace" font-size="14" fill="#c9b8ff">~ welcome to the terminal ~</text>

  <!-- left chibi girl -->
  <g transform="translate(90,110)">
    <path d="M-55,70 Q-55,10 0,5 Q55,10 55,70 Z" fill="url(#hairL)"/>
    <circle cx="0" cy="0" r="42" fill="#ffe0c2"/>
    <path d="M-42,-5 Q-45,-55 0,-58 Q45,-55 42,-5 Q30,-40 0,-38 Q-30,-40 -42,-5 Z" fill="url(#hairL)"/>
    <circle cx="-15" cy="-2" r="6" fill="#1c2b3a"/>
    <circle cx="15" cy="-2" r="6" fill="#1c2b3a"/>
    <circle cx="-13" cy="-4" r="2" fill="#ffffff"/>
    <circle cx="17" cy="-4" r="2" fill="#ffffff"/>
    <path d="M-8,16 Q0,22 8,16" stroke="#c97b5a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="-24" cy="10" r="6" fill="#ff9ec4" opacity="0.6"/>
    <circle cx="24" cy="10" r="6" fill="#ff9ec4" opacity="0.6"/>
  </g>

  <!-- right chibi girl -->
  <g transform="translate(810,110)">
    <path d="M-55,70 Q-55,10 0,5 Q55,10 55,70 Z" fill="url(#hairR)"/>
    <circle cx="0" cy="0" r="42" fill="#ffe0c2"/>
    <path d="M-44,0 Q-52,-50 0,-58 Q52,-50 44,0 Q34,-38 0,-36 Q-34,-38 -44,0 Z" fill="url(#hairR)"/>
    <path d="M-44,0 Q-58,20 -46,42" stroke="url(#hairR)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M44,0 Q58,20 46,42" stroke="url(#hairR)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="-15" cy="-2" r="6" fill="#3a1c2b"/>
    <circle cx="15" cy="-2" r="6" fill="#3a1c2b"/>
    <circle cx="-13" cy="-4" r="2" fill="#ffffff"/>
    <circle cx="17" cy="-4" r="2" fill="#ffffff"/>
    <path d="M-8,16 Q0,20 8,16" stroke="#c97b5a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="-24" cy="10" r="6" fill="#ff9ec4" opacity="0.6"/>
    <circle cx="24" cy="10" r="6" fill="#ff9ec4" opacity="0.6"/>
  </g>
</svg>
